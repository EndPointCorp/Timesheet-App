# nginx front door: serves the built SPA and proxies /api to Rails.
#
# TLS terminates upstream at Coolify/Traefik, which forwards plain HTTP with
# X-Forwarded-Proto: https. Pass that through untouched; when it's absent
# (local dev, direct access) fall back to this hop's own scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Edge liveness (answered by nginx itself).
    location = /healthz {
        return 200 "ok\n";
    }

    # Backend health through the edge (useful for smoke tests).
    location = /up {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        # No URI part on proxy_pass: the /api prefix is preserved, matching
        # the Rails routes (everything is scoped under /api).
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_redirect off;
        # PDF report generation (wkhtmltopdf) can be slow.
        proxy_read_timeout 300s;
    }

    # CRA emits content-hashed filenames under /static — cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entrypoint document must always revalidate so deploys roll out.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
