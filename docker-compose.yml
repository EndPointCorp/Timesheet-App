# Local development stack: `make dev` (or plain `docker compose up`).
# Preview/production environments use their own standalone files because
# Coolify deploys exactly one compose file — see docker-compose.preview.yml.
#
# Project name `timesheet`
#
# The published ports are variables so that several checkouts of this repo can
# each run their own stack at the same time (see bin/wt, which assigns a free
# set per worktree). Leave them unset and you get the defaults below.

name: timesheet

services:
  frontend:
    build:
      context: ./timesheet-frontend
      target: dev
    # Safe for every checkout to share: this image is node_modules and nothing
    # else, and the code it serves arrives through the bind mount below. So a
    # worktree always runs its own branch, and a second worktree starts without
    # building anything. Previews and production use the nginx stage instead.
    image: timesheet-frontend:dev
    environment:
      # The app calls /api on its own origin and the dev server forwards it
      # (src/setupProxy.js). Configured here rather than as a fixed string in
      # package.json so the same code works against a container, a laptop, or
      # one of several task stacks.
      API_PROXY_TARGET: http://backend:3000
      # Wins over a mounted timesheet-frontend/.env.local — bin/wt writes one
      # for host-run dev servers, and its PORT would otherwise move this one
      # off the port compose publishes.
      PORT: 3000
      # The file watcher does not see writes through a bind mount without this.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./timesheet-frontend:/app
      # Keeps the image's node_modules. Without it the bind mount above hides
      # them and nothing starts.
      - /app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first and the dev server only listens on IPv4. Generous start
      # period — the first compile takes a while.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  backend:
    build:
      context: ./railsts
      target: dev
    image: timesheet-backend:local
    environment:
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-timesheet}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-timesheet}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required — cp .env.example .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      APP_HOST: ${APP_HOST:-}
      RAILS_ENV: development
      CONTAINER_ROLE: web
      # On a fresh/empty DB, restore the newest seeds/*.sql.zst (if any)
      # before db:prepare — same mechanism previews use. No dump present =>
      # demo seeds as before. Never touches a non-empty DB.
      RESTORE_SEED_ON_EMPTY: "true"
    volumes:
      - ./railsts:/rails
      - ./seeds:/seed:ro
    tmpfs:
      - /rails/tmp
    ports:
      - "127.0.0.1:${API_PORT:-8088}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-timesheet}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required — cp .env.example .env}
      POSTGRES_DB: ${DATABASE_NAME:-timesheet}
    ports:
      # 127.0.0.1 matters here and above: without it these listen on every
      # interface, and Docker's firewall rules sit in front of the host's — so
      # a dev database with a published password is reachable from the network
      # you happen to be on.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-timesheet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  # Named `postgres_data` under project `timesheet` => the same
  # `timesheet_postgres_data` volume the old railsts/ compose stack used.
  postgres_data:
