stages:
  - build
  - deploy
  - cleanup

variables:
  PREVIEW_DOMAIN: "timesheet.temphost.net"
  FRONTEND_MR_IMAGE: ${CI_REGISTRY_IMAGE}/frontend:mr-${CI_MERGE_REQUEST_IID}
  FRONTEND_SHA_IMAGE: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}
  BACKEND_MR_IMAGE: ${CI_REGISTRY_IMAGE}/backend:mr-${CI_MERGE_REQUEST_IID}
  BACKEND_SHA_IMAGE: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}
  FRONTEND_CACHE_IMAGE: ${CI_REGISTRY_IMAGE}/frontend:buildcache
  BACKEND_CACHE_IMAGE: ${CI_REGISTRY_IMAGE}/backend:buildcache

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.buildkit:
  stage: build
  tags:
    - image-build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - |
      cat > ~/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF

build_backend_mr:
  extends: .buildkit
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=./backend \
        --local dockerfile=./backend \
        --opt build-arg:APP_VERSION=${CI_COMMIT_SHA} \
        --output type=image,\"name=${BACKEND_MR_IMAGE},${BACKEND_SHA_IMAGE}\",push=true \
        --import-cache type=registry,ref=${BACKEND_CACHE_IMAGE} \
        --export-cache type=registry,ref=${BACKEND_CACHE_IMAGE},mode=max
  only:
    - merge_requests

build_frontend_mr:
  extends: .buildkit
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=./frontend \
        --local dockerfile=./frontend \
        --output type=image,\"name=${FRONTEND_MR_IMAGE},${FRONTEND_SHA_IMAGE}\",push=true \
        --import-cache type=registry,ref=${FRONTEND_CACHE_IMAGE} \
        --export-cache type=registry,ref=${FRONTEND_CACHE_IMAGE},mode=max
  only:
    - merge_requests

build_backend_main:
  extends: .buildkit
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=./backend \
        --local dockerfile=./backend \
        --opt build-arg:APP_VERSION=${CI_COMMIT_SHA} \
        --output type=image,\"name=${BACKEND_SHA_IMAGE},${CI_REGISTRY_IMAGE}/backend:latest\",push=true \
        --import-cache type=registry,ref=${BACKEND_CACHE_IMAGE} \
        --export-cache type=registry,ref=${BACKEND_CACHE_IMAGE},mode=max
  only:
    - main

build_frontend_main:
  extends: .buildkit
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=./frontend \
        --local dockerfile=./frontend \
        --output type=image,\"name=${FRONTEND_SHA_IMAGE},${CI_REGISTRY_IMAGE}/frontend:latest\",push=true \
        --import-cache type=registry,ref=${FRONTEND_CACHE_IMAGE} \
        --export-cache type=registry,ref=${FRONTEND_CACHE_IMAGE},mode=max
  only:
    - main

deploy_preview:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/coolify-preview.py deploy-preview
        --mr "${CI_MERGE_REQUEST_IID}"
        --branch "${CI_COMMIT_REF_NAME}"
        --frontend-image "${FRONTEND_SHA_IMAGE}"
        --backend-image "${BACKEND_SHA_IMAGE}"
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://mr-${CI_MERGE_REQUEST_IID}.${PREVIEW_DOMAIN}
    on_stop: cleanup_preview
  only:
    - merge_requests

cleanup_preview:
  stage: cleanup
  image: alpine:3
  interruptible: false
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/coolify-preview.py delete-preview --mr "${CI_MERGE_REQUEST_IID}"
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  only:
    - merge_requests
  when: manual
