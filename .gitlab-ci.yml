# CI/CD: build both images once per pipeline, then drive Coolify via
# scripts/coolify-preview.py (preview app per MR).
# Production deploy is intentionally deferred — see COOLIFY.md.
# See COOLIFY.md for the required CI/CD variables and one-time setup.

stages:
  - build
  - deploy
  - cleanup

variables:
  PREVIEW_DOMAIN: "timesheet.temphost.net"
  FRONTEND_MR_IMAGE: ${CI_REGISTRY_IMAGE}/frontend:mr-${CI_MERGE_REQUEST_IID}
  FRONTEND_SHA_IMAGE: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}
  BACKEND_MR_IMAGE: ${CI_REGISTRY_IMAGE}/backend:mr-${CI_MERGE_REQUEST_IID}
  BACKEND_SHA_IMAGE: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}
  DOCKER_BUILDKIT: "1"

default:
  image: docker:27
  interruptible: true
  # Retry infrastructure flakes (runner/network), never real script failures.
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout
      - scheduler_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# --- Build (merge requests) -------------------------------------------

build_backend_mr:
  stage: build
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker build --network host
        --build-arg APP_VERSION=${CI_COMMIT_SHA}
        -t ${BACKEND_MR_IMAGE} -t ${BACKEND_SHA_IMAGE} ./railsts
    - docker push ${BACKEND_MR_IMAGE}
    - docker push ${BACKEND_SHA_IMAGE}
  only:
    - merge_requests

build_frontend_mr:
  stage: build
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker build --network host
        -t ${FRONTEND_MR_IMAGE} -t ${FRONTEND_SHA_IMAGE} ./timesheet-frontend
    - docker push ${FRONTEND_MR_IMAGE}
    - docker push ${FRONTEND_SHA_IMAGE}
  only:
    - merge_requests

# --- Build (main) ------------------------------------------------------

build_backend_main:
  stage: build
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker build --network host
        --build-arg APP_VERSION=${CI_COMMIT_SHA}
        -t ${BACKEND_SHA_IMAGE} -t ${CI_REGISTRY_IMAGE}/backend:latest ./railsts
    - docker push ${BACKEND_SHA_IMAGE}
    - docker push ${CI_REGISTRY_IMAGE}/backend:latest
  only:
    - main

build_frontend_main:
  stage: build
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker build --network host
        -t ${FRONTEND_SHA_IMAGE} -t ${CI_REGISTRY_IMAGE}/frontend:latest ./timesheet-frontend
    - docker push ${FRONTEND_SHA_IMAGE}
    - docker push ${CI_REGISTRY_IMAGE}/frontend:latest
  only:
    - main

# --- Preview per MR ----------------------------------------------------

deploy_preview:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/coolify-preview.py deploy-preview
        --mr "${CI_MERGE_REQUEST_IID}"
        --branch "${CI_COMMIT_REF_NAME}"
        --frontend-image "${FRONTEND_SHA_IMAGE}"
        --backend-image "${BACKEND_SHA_IMAGE}"
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://mr-${CI_MERGE_REQUEST_IID}.${PREVIEW_DOMAIN}
    on_stop: cleanup_preview
  only:
    - merge_requests

cleanup_preview:
  stage: cleanup
  image: alpine:3
  interruptible: false
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/coolify-preview.py delete-preview --mr "${CI_MERGE_REQUEST_IID}"
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  only:
    - merge_requests
  when: manual

