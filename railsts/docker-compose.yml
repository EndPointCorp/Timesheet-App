name: timesheet

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-timesheet}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-timesheet}
      POSTGRES_DB: ${DATABASE_NAME:-timesheet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: ["rails", "server", "-b", "0.0.0.0"]
    volumes:
      - .:/app
    tmpfs:
      - /app/tmp
    ports:
      - "8088:3000"
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: ${DATABASE_USERNAME:-timesheet}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-timesheet}
      DATABASE_NAME: ${DATABASE_NAME:-timesheet}
      RAILS_ENV: development

volumes:
  postgres_data:
