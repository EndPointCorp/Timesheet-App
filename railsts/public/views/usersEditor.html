<div class="row">
  <header class="padded">
    <div class="row roles-header">
      <dl class="sub-nav buttons">
        <dd class="active">
          <a href="/#/users-editor">
            Users
          </a>
        </dd>
        <dd>
          <a href="/#/groups-editor">
            Groups
          </a>
        </dd>
      </dl>
    </div>
  </header>
  <section class="user-area">
    <div class="row">
      <div class="eight columns" id="main">
        <div class="twelve columns">
          <div class="four columns">
            <a class="button roles-button" href="#/create_user">
              <span class="icon-user-plus"></span>
              New User
            </a>
          </div>
          <div class="four columns">
            <span class="show-label">Show inactive:</span>
            <span class="show-users-switch">
            <charts-visibility-switcher show-status="showAllUsers"></charts-visibility-switcher>
            </span>
          </div>
          <div class="four columns">
            <input type="text" ng-model="searchUser" placeholder="Search">
          </div>
        </div>
        <div  class="twelve columns">
          <user-details
            selected-button="selectedButton"
            user-details="usersDetail"
            time-zones="timeZones"
            button-items="teamItems"
            group-items="groupItems"
            right-type-items="rightTypeItems"
            search-user="searchUser"
            show-inactive-users="showAllUsers"
            filter-group="filterGroup"
            filter-team="filterTeam"
            all-i-c-roles="allICRoles"
            all-i-c-users="allICUsers"
            group-no-team-items="groupNoTeamItems">
          </user-details>
        </div>
      </div>
      <div class="four columns" id="side">
        <teams selected-item="selectedTeam" title="'Teams'" is-default-item=true general-items="teamItems">
          <span class="right-align">
              <ts-help title="Filter by Team">
                Lists all the teams to select a particular team to filter the list
              </ts-help>
          </span>
        </teams>
        <teams selected-item="selectedGroup" title="'Other groups'" general-items="groupNoTeamItems">
          <span class="right-align">
              <ts-help title="Filter by Groups">
                Lists all the groups except teams to select a particular group to filter the list
              </ts-help>
          </span>
        </teams>
      </div>
    </div>
  </section>
</div>
