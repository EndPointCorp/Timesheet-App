<div>
  <table cellpadding="0" cellspacing="0" class="hours-in-the-bank">
    <thead>
      <tr>
        <th>
          <ts-help title="Work entry reviews">
          Shows statistics about entries that you need to review.
          </ts-help>
          &nbsp;
          Work entry reviews
        </th>
        <th></th>
        <th>
          <button ng-show="left != 0" class="button medium" type="submit" ng-click="reviewNow()">
            Review now
          </button>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="hours-chart">
          <b>Unreviewed entries:</b>
        </td>
        <td class="hours-triangle"><div>&nbsp;</div></td>
        <td class="hours-left">{{ left }}</td>
      </tr>
      <tr ng-show="lastFrom != null">
        <td class="hours-chart">
          <b>Oldest unreviewed from:</b>
        </td>
        <td class="hours-triangle"><div>&nbsp;</div></td>
        <td class="hours-left">{{ lastFrom }}</td>
      </tr>
    </tbody>
  </table>
</div>
