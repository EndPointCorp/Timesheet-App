<div>
  <section>
    <warning-box class="switch-user-warning-without-header"></warning-box>
    <div class="twelve columns create_group">
      <div class="four columns"></div>
      <div id="msg" class="four columns panel create_group" ng-class="msgClass"size="30" ng-show="showMsg">{{msg}}</div>
      <div class="four columns"></div>
    </div>
    <div class="twelve columns"> 
      <div class="four columns"></div>
      <div class="four columns panel create_group" id="create_group">
        <form>
          <div>
            <input size="30" class="mousetrap" placeholder="Group name" type="text" ng-model="label" ts-focus="fieldFocused">
          </div>
          <div>
            <input size="30" class="mousetrap" placeholder="Code - auto populated" type="text" ng-model="code">
          </div>
          <div>
            <input size="30" class="mousetrap" placeholder="Description" type="text" ng-model="description">
          </div>
          <div>
            <a href="" class="button login" ng-click="createGroup()">Create group</a>
          </div>
        </form>
      </div>
      <div class="four columns"></div>
    </div>
  </section>
</div>
