<div ng-class="{'charts-multi-select': true, 'dark-highlighted all-nodes': allowSelect == 'all'}" ng-repeat="level in chartLevels">
  <select 
    ng-change="$parent.valueChanged(level)"
    ng-model="level.selected"
    ng-options="chart as chart.title for chart in level.charts">
    <option></option>
  </select>
  <span ng-if="allowSelect == 'all' && level.selected !== undefined && level.selected !== null && level.selected !== 'null'"
        ng-click="clearLevel(level)"
    >✖</span>
  <div class="clearfix">&nbsp;</div>
</div>
