<div>
<div class="user-panel" dir-paginate="user in filteredUserDetailsList | itemsPerPage: pageSize" current-page="currentPage">
  <div class="static">
  <div class="user-details-panel" ng-mouseover="setCurrentUserId(user.id)">
    <div class="name">
      <span class="save-tools">
        <span class="apply-changes-item" ng-show="user.changes.isChanged" ng-click="saveChanges(user.changes, user.id)">
          <a href="" title="Save"><img class="rights-close-icon" src="images/ok_icon.png"></a>
        </span>
        <span class="apply-changes-item" ng-show="user.changes.isChanged" ng-click="cancelChanges(user.id)">
          <a href="" title="Cancel"><img class="rights-close-icon" src="images/red_button_cancel.png"></a>
        </span>
      </span>
      <span contenteditable="true" placeholder="Name" ng-model="user.name" strip-br="true" select-non-editable="true" ng-change="setName()" class="name">
      </span>
      <span class="status">
        <status-switcher switcher-user-status="user['status']" status-change="setStatus"></status-switcher>
      </span>
    </div>
    <div class="email">
      <span contenteditable="true" ng-model="user.email" strip-br="true" select-non-editable="true" ng-change="setEmail()" class="email">
      </span>
    </div>
    <div class="row">
      <div class="roles-left grey-title">Password:</div>
      <div class="roles-right">
        <input type="password" ng-blur="blurPassword(user)" ng-focus="focusPassword(user)" ng-model="user.password" ng-change="setPassword(user)"/>
      </div>
    </div>
    <div class="row">
      <div class="roles-left grey-title">Team:</div>
      <div class="roles-right">
        <ul class="items-list" ng-repeat="team in user.myteam | orderBy: 'display_label' track by team.id">
          <li class="items">{{ ::team.display_label }}
            <img class="close-icon" src="images/window-close.png" ng-click="removeTeam(team)">
          </li>
        </ul>
        <div class="add-item-wrapper" ng-mouseleave="showTeamModal=false">
          <span class="add-item" ng-mouseover='showTeamModal=true' ng-init='showTeamModal=false'>
            <a href=""><img class="plus-icon" src="images/grey-plus-icon.png"></a>
            <modal-dialog class="ng-modal-dialog-postion" show='showTeamModal'>
              <span class="add-icon">
                <a href=""><img class="plus-icon" src="images/plus_icon_white.png"></a>
              </span>
              <select-button selected-button="$parent.$parent.$parent.addTeam" button-items="::buttonItems" added-items="user.myteam" is-change="showTeamModal"></select-button>
            </modal-dialog>
          </span>
        </div>
      </div>
      <br/>
    </div>
    <div class="row">
      <div class="roles-left grey-title">Groups:</div>
      <div class="roles-right">
        <ul class="items-list" ng-repeat="group in user.myroles | orderBy: 'display_label' track by group.id">
          <li class="items">{{ ::group.label }}
            <img ng-show="group.isDirect" class="close-icon" src="images/window-close.png" ng-click="removeGroup(group)">
            <ts-help ng-show="!group.isDirect" title="Indirect Role">
              Role inherited
            </ts-help>
          </li>
        </ul>
        <div class="add-item-wrapper" ng-mouseleave="showModal=false">
          <span class="add-item" ng-mouseover='showModal=true' ng-init='showModal=false'>
            <a href=""><img class="plus-icon" src="images/grey-plus-icon.png"></a>
            <modal-dialog class="ng-modal-dialog-postion" show='showModal'>
              <span class="add-icon">
                <a href=""><img class="plus-icon" src="images/plus_icon_white.png"></a>
              </span>
              <select-button selected-button="$parent.$parent.$parent.addGroup" button-items="::groupNoTeamItems" added-items="user.myroles" is-change="showModal"></select-button>
            </modal-dialog>
          </span>
        </div>
      </div>
      <br/>
    </div>
    <div class="dynamic" ng-if=user.custom>
      <div class="grey-title">Rights granted:</div>
      <div class="rights-items-list">
         <div masonry load-images="false" reload-on-show="true" preserve-order="true">
          <div class="masonry-brick rights-items" ng-repeat="right in user.myrights | orderBy: 'label' track by right.id">
            <div class="rights-header">
              <div class="rights-title">{{ ::right.label }}</div>
              <span class="rights-remove-item" ng-if="right.is_direct">
                <img class="rights-close-icon" src="images/red_button_cancel.png" ng-click="removeRight(right)">
              </span>
              <span class="right-align" ng-if="!right.is_direct">
                  <ts-help title="Indirect Rights">
                    Rights from roles of the user
                  </ts-help>
              </span>
              <span class="add-item add-item-small" ng-if="right.target_kind_code" ng-mouseover='showModal=true' ng-init='showModal=false'>
                <a href=""><img class="plus-icon-small" src="images/grey-plus-icon.png"></a>
                <modal-dialog class="ng-modal-dialog-postion" ng-mouseleave="showModal=false" show='showModal'>
                  <span class="add-icon">
                    <a href=""><img class="plus-icon" src="images/plus_icon_white.png"></a>
                  </span>
                  <div class="row collapse">
                    <div class="eight columns target-view" ng-if="right.target_kind_code=='work_chart' || right.target_kind_code == 'site_mgmt_action' || right.target_kind_code == 'account'">
                      <div>
                        <quick-search chart="$parent.$parent.$parent.$parent.$parent.$parent.$parent.$parent.selectedChart" include-nonleafs="true" include-level="dead" focus="true"></quick-search>
                      </div>
                      <div>
                        <charts-multi-select chart="$parent.$parent.$parent.$parent.$parent.$parent.$parent.$parent.selectedChart" allow-select="all" include-level="dead"></charts-multi-select>
                      </div>
                      <div>
                        <a class="slim-button add-workchart" ng-click="addWorkChart(right)" href="">Add</a>
                      </div>
                    </div>
                    <div class="eight columns target-view" ng-if="right.target_kind_code == 'role'">
                      <div>
                        <multi-pick ng-model="roletags" display-property="name"
                            add-on-enter="{{addOnEnter}}"
                            add-on-blur="true"
                            placeholder="Type to search through roles"
                            remove-tag-symbol="{{removeTagSymbol}}"
                            max-length="50"
                            add-from-autocomplete-only="true"
                            search-string="searchString"
                            is-show-all="isShowAll"
                            show-all="showAll">
                            <auto-complete source="loadRoles($query)"
                                debounce-delay="0"
                                min-length="1"
                                max-results-to-show="30">
                            </auto-complete>
                        </multi-pick>
                      </div>
                      <div>
                        <a class="slim-button add-workchart" ng-click="addTargets(right, roletags)" href="">Add</a>
                      </div>
                    </div>
                    <div class="eight columns target-view" ng-if="right.target_kind_code == 'user'">
                      <div>
                        <multi-pick ng-model="usertags" display-property="name"
                            add-on-enter="{{addOnEnter}}"
                            add-on-blur="true"
                            placeholder="Type to search through roles"
                            remove-tag-symbol="{{removeTagSymbol}}"
                            max-length="50"
                            add-from-autocomplete-only="true"
                            search-string="searchString"
                            is-show-all="isShowAll"
                            show-all="showAll">
                            <auto-complete source="loadUsers($query)"
                                debounce-delay="0"
                                min-length="1"
                                max-results-to-show="30">
                            </auto-complete>
                        </multi-pick>
                      </div>
                      <div>
                        <a class="slim-button add-workchart" ng-click="addTargets(right, usertags)" href="">Add</a>
                      </div>
                    </div>
                  </div>
                </modal-dialog>
              </span>
            </div>
            <div>
              <div class="items-list" ng-repeat="target in right.targets | orderBy: 'label' track by target.id">
                <div class="rights-child-items">{{ ::target.label }}
                  <img class="rights-child-close-icon" src="images/window-close.png" ng-click="removeTarget(right, target)">
                </div>
              </div>
            </div>
          </div>
        </div>
        <span class="add-item" ng-mouseover='showRightTypeModal=true' ng-init='showRightTypeModal=false'>
          <a href=""><img class="plus-icon" src="images/grey-plus-icon.png"></a>
          <span>
            <modal-dialog class="ng-modal-dialog-postion" ng-mouseleave="showRightTypeModal=false" show='showRightTypeModal'>
              <span class="add-icon">
                <a href=""><img class="plus-icon" src="images/plus_icon_white.png"></a>
              </span>
              <select-button selected-button="$parent.$parent.$parent.$parent.addRightType" button-items="rightTypeItems" added-items="user.myrights" is-change="showRightTypeModal"></select-button>
            </modal-dialog>
          </span>
        </span>
      </div>
      <br/>
      <div class="grey-title time-zone-left">Time zone:</div>
      <div class="time-zone-right">
        <select id="timeZoneDropDown" ng-model="selectedTimeZone" ng-change="setTimeZone(selectedTimeZone)">
          <option ng-repeat="timeZone in ::timeZones track by $index" value="{{::timeZone}}" ng-selected="user.time_zone == timeZone">{{ ::timeZone }}</option>
        </select>
      </div>
    </div>
  </div>
  <br/>
  </div>

  <div class="white-border" ng-click="user.custom=!user.custom">
    <img ng-if=!user.custom class="down-arrow-icon" src="images/up-triangle.png">
    <img ng-if=user.custom class="arrow-icon" src="images/up-triangle.png">
  </div>
</div>
    <div class="text-center">
      <dir-pagination-controls boundary-links="true" confirm-page-change="confirmChangeHandler()" on-page-change="pageChangeHandler(newPageNumber)" template-url="views/_dirPagination.html"></dir-pagination-controls>
    </div>
  <p>{{ callUserUpdate() }}</p>
</div>
