<div>
  <div cellspacing="0" class="teams">
    <div>
      <span class="team-title">
      {{ title }}
      </span>
      <ng-transclude></ng-transclude>
    </div>
    <dl class="sub-team team-view">
      <dd ng-repeat="generalItem in generalItems | orderBy: 'label'" ng-class="{active : isSelectedItem(generalItem)}" class="team-block">
        <a ng-click="selectItem(generalItem)">{{::generalItem.label}}</a>
      </dd>  
    </dl>
  </div>
</div>
