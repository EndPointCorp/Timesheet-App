<div>
  <div cellspacing="0" class="buttoner">
    <div>
      <span class="buttoner-title">
      {{ title }}
      </span>
      <ng-transclude></ng-transclude>
    </div>
    <dl class="sub-buttoner buttoner-view">
      <dd ng-repeat="generalItem in generalItems" ng-class="{active : isSelectedItem(generalItem)}" class="buttoner-block">
        <a ng-click="selectItem(generalItem)">{{::$parent.getLabel(generalItem)}}</a>
      </dd>  
    </dl>
  </div>
</div>
