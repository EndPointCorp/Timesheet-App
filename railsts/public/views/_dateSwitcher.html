<div>
  <div id="calendar-controls">
    <span class="calendar-user-chooser" ng-show="isUserView">
      <label>Calendar for user:</label>
      <select ng-model="calendarUser">
        <option ng-repeat="user in possibleUsers" ng-selected="user == calendarUser">{{ user }}</option>
      </select>
    </span>
    <a href="" ng-click="previous()" class="left">
      <span class="icon-left"></span>
    </a>
    <select ng-model="chosenYear">
      <option ng-repeat="y in possibleYears" ng-selected="y == year">{{ y }}</option>
    </select>
    <select ng-model="chosenMonth">
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7">July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>
    <select ng-model="chosenDay" ng-show="mode != 'months'">
      <option ng-repeat="d in possibleDays" ng-selected="d == day">{{ d }}</option>
    </select>
    <a href="" ng-click="next()" class="right">
      <span class="icon-right"></span>
    </a>
    <div class="weekday" ng-show="mode != 'months'">
      <div class="weekday-triangle"></div>
      <span>{{ dayName }}</span>
    </div>
  </div>
</div>
