<form>
  <div class="twelve columns">&nbsp;</div>
  <div class="row">
    <div class="two columns greyed smaller switch-label">
      Date Start:
    </div>
    <div class="four columns text-line">
      <quick-datepicker ng-model="workTransaction.date"
                        label-format='yyyy-MM-dd'
                        disable-timepicker='true'></quick-datepicker>
    </div>
    <div class="two columns greyed smaller switch-label">
      Date End:
    </div>
    <div class="four columns text-line">
      <quick-datepicker ng-model="workTransaction.date_closed"
                        label-format='yyyy-MM-dd'
                        disable-timepicker='true'></quick-datepicker>
    </div>
  </div>
  <div class="row input-row">
    <div class="two columns greyed smaller switch-label">
      Hours:
    </div>
    <div class="four columns">
      <input type="text" class="new-workTransaction.hours" placeholder="Enter hours number"
             ng-model="workTransaction.hours">
    </div>
    <div class="two columns greyed smaller switch-label">
      Mode:
    </div>
    <div class="four columns">
      <select ng-model="workTransaction.mode">
        <option value="billable">Billables Only</option>
        <option value="nonbillable">Nonbillables Only</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="twelve columns">
      <textarea type="text" class="new-workTransaction.description" placeholder="Description"
                ng-model="workTransaction.description"></textarea>
    </div>
  </div>
  <div class="row">
    <div class="two columns text-line greyed smaller">
      Recur Monthly:
    </div>
    <div class="ten columns">
      <cron-spec edit="true" ng-model="workTransaction.recur_at"></cron-spec>
    </div>
  </div>
  <div class="row">
    <div class="twelve columns">
      &nbsp;
    </div>
  </div>
  <div class="row" ng-show="showMode">
    <div class="two columns greyed smaller switch-label">
      <ts-help title="Recurring Mode">
        <p>
          When set to cumulatively new recurring transaction will add up to the previosuly created ones. When unset, the recurring mode will be set to "zeroing out". In this mode upon each recurrance, previous transactions are being closed.
        </p>
      </ts-help>
      Cumulative?
    </div>
    <div class="one columns">
      <ts-switcher ng-model='workTransaction.recur_mode_cumulative'></ts-switcher>
    </div>
    <div class="nine columns">
      &nbsp;
    </div>
  </div>
  <div class="input-row row">
    <div class="offset-by-eight two columns">
      <button class="button alert" type="button" ng-click="cancel()">Cancel</button>
    </div>
    <div class="two columns">
      <button class="button save" type="button"  ng-click="save()">Save</button>
    </div>
  </div>
</form>
