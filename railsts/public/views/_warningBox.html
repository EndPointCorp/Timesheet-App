<div class="switch-user-warning row" ng-show="currentUser.as != null">
  <ts-help title="Switched Role">
    Click on the close icon at right top corner to switch back to your user
  </ts-help>
  <div class="warning-message">
    <b>Warning:</b> You are logged in as <b>{{capitalise(currentUser.asLabel)}}</b>
  </div>
</div>
