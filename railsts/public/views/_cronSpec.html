<div ng-class="{ 'cron-spec': true, 'editable': isEditable, 'const': !isEditable }">
  <div class="one column" ng-show="isEditable">
    <div>
      <ts-switcher ng-model='recurMonthly' ng-disabled='!isEditable'></ts-switcher>
    </div>
  </div>
  <div ng-show="!isEditable && recurMonthly" class="empty">
    Yes
  </div>
  <div ng-show="!isEditable && !recurMonthly" class="empty">
    No
  </div>
</div>
