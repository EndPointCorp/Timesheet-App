<div class="row"
     ng-if="workChart !== undefined && workChart !== null"
     >
    <div class="two columns">&nbsp;</div>
    <div class="eight columns dark-highlighted">
      <div class="transactions padded">
      <div class="row">
        <div class="four columns text-line">
          <ts-help title="Transaction">
            <p>
              To add a new transaction enter an amount of hours that 
              should be set to transaction. Value can be signed integer only.
            </p>
            <p>
              To edit a transaction click on <img src="/images/pencil.png"> icon,
              set hours amount and then click on 
              <img src="/images/accept-entry.png"> icon to save it.
            </p>
            <p>
              List is sorted by date, descending.
            </p>
          </ts-help>
          Transactions
        </div>
        <div class="offset-by-four four columns">
          <form>
            <button class="button save" 
                    ng-click="$parent.showNew = true" 
                    type="submit"
                    ng-show="$parent.showNew == false"
                    >New</button>
            </form>
        </div>
      </div>
      <div ng-show="$parent.showNew">
        <transaction-form on-cancel="$parent.showNew = false" 
                          on-save="refresh()"
                          work-chart="workChart"
                          ></transaction-form>
      </div>
        <div class="row">

          <transaction-preview
              ng-repeat="transaction in transactions"
              transaction="transaction"
              on-delete="refresh()"
              on-update="refresh()"
              >
          </transaction-preview>
        </div>
      </div>  
    </div>
    <div class="four columns">&nbsp;</div>
  </div>
