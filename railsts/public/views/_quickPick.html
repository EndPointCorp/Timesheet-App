<div class="button dropdown" ng-click="showQuickPick = !showQuickPick">
  Quick pick
  <span class="icon-down-dir"></span>
  <div ng-class="{'no-hover':true,shown:true}" ng-show="dropShown" click-anywhere-but-here="openOrCloseMenu();">
    <div class="clients">
      <span>Clients</span>
      <ul>
        <li ng-repeat="chart in clients" ng-click="choose(chart)">{{ chart.title }}</li>
      </ul>
    </div>
    <div class="other">
      <span>Other</span>
      <ul>
        <li ng-repeat="chart in others" ng-click="choose(chart)">{{ chart.title }}</li>
      </ul>
    </div>
  </div>
</div>
