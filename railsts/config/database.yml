default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  host: <%= ENV.fetch('DATABASE_HOST') { 'db' } %>
  port: <%= ENV.fetch('DATABASE_PORT') { 5432 } %>
  username: <%= ENV.fetch('DATABASE_USERNAME') { 'timesheet' } %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') { 'timesheet' } %>
  # Rails 6.1+ runs `SET intervalstyle = iso_8601` so it can parse intervals as
  # ActiveSupport::Duration. This app's Interval class expects the legacy
  # "HH:MM:SS" form, so force the session back to it. Pairs with the
  # interval->String type override in config/initializers/custom_postgres_types.rb.
  variables:
    intervalstyle: postgres

development:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME') { 'timesheet' } %>
  template: template0

test:
  <<: *default
  # Decoupled from DATABASE_NAME (which dotenv sets to the dev DB) so the test
  # env can never point at dev data. Override with TEST_DATABASE_NAME if needed.
  database: <%= ENV.fetch('TEST_DATABASE_NAME') { 'timesheet_test' } %>

production:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME') { 'timesheet' } %>
