# Development stack: Postgres + Rails API + React dev server.
#
#   docker compose up
#
# Open http://localhost:3000 and sign in as admin@example.com / please1234.
#
# This is for working on the app, not for running it in production. It builds
# images here and mounts your source so edits reload. A deployment should pull
# prebuilt, tagged images and serve a compiled frontend from a web server.
#
# The credentials below are development-only and deliberately in the open: this
# database is reachable from your machine and nowhere else. Do not reuse this
# file, or these values, anywhere that is.
#
# Every setting can be overridden without editing this file — put the value in a
# .env next to it, e.g. `WEB_PORT=3100` if something already has port 3000.

name: timesheet

services:
  db:
    image: postgres:16.13
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timesheet}
      POSTGRES_USER: ${POSTGRES_USER:-timesheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timesheet}
    ports:
      # 127.0.0.1 matters: without it this listens on every interface, and
      # Docker's firewall rules sit in front of the host's.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres runs everything in here the first time it creates the data
      # volume, in filename order. That gives us the schema and the lookup tables
      # with no setup script. They have to go through psql rather than Rails:
      # pg_dump emits meta-commands and a search_path reset that the Rails
      # connection cannot cope with.
      - ./railsts/db/structure.sql:/docker-entrypoint-initdb.d/01-structure.sql:ro
      - ./railsts/db/seeds/reference_data.sql:/docker-entrypoint-initdb.d/02-reference-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build: ./railsts
    environment:
      RAILS_ENV: development
      # These win over railsts/.env: dotenv does not overwrite a variable that
      # is already set.
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-timesheet}
      DATABASE_USERNAME: ${POSTGRES_USER:-timesheet}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-timesheet}
    # db:seed is idempotent (it tops demo data up to a fixed size rather than
    # appending), so this is safe on every start. No migrate: the schema format
    # is :sql, so migrating would rewrite db/structure.sql in your checkout.
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
      bundle exec rails db:seed &&
      bundle exec rails server -b 0.0.0.0"
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    volumes:
      - ./railsts:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./timesheet-frontend
    environment:
      # The app calls /api on its own origin and the dev server forwards it.
      # Keeping the target here rather than in package.json is what lets the same
      # code run against a container, a laptop, or anything else.
      API_PROXY_TARGET: http://api:3000
      # The file watcher does not see writes through a bind mount without this.
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./timesheet-frontend:/app
      # Keeps the image's node_modules. Without it the bind mount above hides
      # them and nothing starts.
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data: